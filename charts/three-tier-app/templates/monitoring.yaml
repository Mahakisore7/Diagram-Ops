{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: diagramforge-alerts
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
spec:
  groups:
    - name: diagramforge
      rules:
        - alert: BackendHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "More than 5% of API requests are failing with 5xx"
        - alert: BackendHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!~"/api/diagrams/generate"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "p95 API latency above 1s (LLM generation excluded)"
        - alert: BackendPodNotReady
          expr: kube_deployment_status_replicas_available{deployment="backend"} < 1
          for: 3m
          labels: { severity: critical }
          annotations:
            summary: "No backend pod is available"
        - alert: MongoDBVolumeAlmostFull
          expr: |
            kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"data-mongodb-.*"}
              / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-mongodb-.*"} < 0.15
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "MongoDB volume has less than 15% free space"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: diagramforge-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "three-tier-app.labels" . | nindent 4 }}
data:
  diagramforge.json: |
    {
      "title": "DiagramForge API",
      "uid": "diagramforge-api",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "id": 1, "type": "timeseries", "title": "Requests / s by status", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (status) (rate(http_request_duration_seconds_count[5m]))", "legendFormat": "{{ "{{status}}" }}" } ] },
        { "id": 2, "type": "timeseries", "title": "Latency p50 / p95 / p99", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "p99" } ] },
        { "id": 3, "type": "timeseries", "title": "Backend CPU (cores)", "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (pod) (rate(process_cpu_seconds_total{service=\"backend\"}[5m]))", "legendFormat": "{{ "{{pod}}" }}" } ] },
        { "id": 4, "type": "timeseries", "title": "Backend memory (RSS)", "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [ { "expr": "process_resident_memory_bytes{service=\"backend\"}", "legendFormat": "{{ "{{pod}}" }}" } ] }
      ]
    }
{{- end }}
