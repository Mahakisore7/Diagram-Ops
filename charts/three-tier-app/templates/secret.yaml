{{- if .Values.secrets.create }}
# KNOWN GAP, scheduled for Phase 12: a Kubernetes Secret is base64, not
# encryption. Values are supplied at install time (--set secrets.*), never
# committed; Phase 12 replaces this with External Secrets Operator pulling
# from AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: diagramforge-secrets
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | required "set secrets.jwtSecret" | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | required "set secrets.groqApiKey" | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | required "set secrets.anthropicApiKey" | quote }}
{{- end }}
