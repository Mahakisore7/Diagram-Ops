apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        {{- include "three-tier-app.labels" . | nindent 8 }}
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "three-tier-app.image" (dict "root" . "image" .Values.frontend.image) | quote }}
          # nginx-unprivileged listens on 8080 and runs as uid 101.
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
