# StatefulSet, not a Deployment: stable network identity and a
# volumeClaimTemplate that reattaches the same EBS volume to the same pod
# after a reschedule, which is what keeps the data intact.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
spec:
  serviceName: mongodb
  replicas: {{ .Values.mongodb.replicaCount }}
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        {{- include "three-tier-app.labels" . | nindent 8 }}
        app: mongodb
    spec:
      # The mongo image runs as uid/gid 999; fsGroup makes the freshly
      # provisioned (root-owned) EBS volume writable by it.
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image | quote }}
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongodb.storageClassName }}
        storageClassName: {{ .Values.mongodb.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongodb.storage }}
---
# Headless Service, required to give StatefulSet pods stable DNS names.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
