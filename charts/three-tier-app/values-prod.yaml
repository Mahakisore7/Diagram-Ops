# More headroom, two replicas per stateless tier, autoscaling on.
frontend:
  image:
    tag: sha-36885c0
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 96Mi }
    limits: { cpu: 300m, memory: 192Mi }

backend:
  image:
    tag: sha-38d17d5
  replicaCount: 2
  env:
    nodeEnv: production
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: 750m, memory: 768Mi }

mongodb:
  # A true HA replica set is a stretch goal; a single member with a
  # persistent volume is what this chart provides, stated rather than faked.
  replicaCount: 1
  storage: 10Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# GitOps: ArgoCD installs this file as-is. The Secret is created out of band
# (Phase 12 replaces that with External Secrets), and Jenkins bumps the two
# image tags below on every successful main build.
global:
  registry: 066118247738.dkr.ecr.ap-south-1.amazonaws.com
secrets:
  create: false
monitoring:
  enabled: true
