# EKS ships without metrics-server, so the HPA reported "cpu: <unknown>" and the
# app showed Degraded in ArgoCD. This provides the resource metrics API.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.12.2
    helm:
      values: |
        replicas: 1
        resources:
          requests: { cpu: 50m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
