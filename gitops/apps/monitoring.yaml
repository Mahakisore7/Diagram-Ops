# Prometheus + Grafana + Alertmanager. Sized for two small spot nodes:
# short retention, small volume, no Alertmanager HA.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 66.2.1
    helm:
      values: |
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence: { enabled: false }
          sidecar:
            dashboards:
              searchNamespace: ALL   # pick up the chart's dashboard ConfigMap in diagramforge
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
        prometheus:
          prometheusSpec:
            retention: 3d
            resources:
              requests: { cpu: 200m, memory: 512Mi }
              limits: { memory: 1Gi }
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 5Gi } }
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
