# The only object ever applied by hand: `kubectl apply -f gitops/root-app.yaml`.
# It watches gitops/apps/, so every other component joins through a Git commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mahakisore7/Diagram-Ops.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
