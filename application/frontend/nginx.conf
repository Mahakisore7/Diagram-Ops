server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # See docs/adr/0007-nginx-api-proxy.md. No path after the upstream
    # address below is deliberate: nginx then forwards the FULL matched URI
    # unmodified, so /api/auth/login reaches the backend as /api/auth/login
    # — exactly what Express's routes (mounted at /api/auth, /api/diagrams)
    # expect. This is the same proxy shape the ALB + Ingress will use in
    # Phase 7/10, so nothing about this config changes between environments.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames under /assets/, so a file's URL
    # changes whenever its content does - safe to cache for a year. Security
    # headers are repeated here because add_header in a location block
    # replaces (does not extend) the server-level ones.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # React Router uses client-side routing — a direct browser request to
    # /app/diagrams/abc123 doesn't correspond to a real file, so nginx must
    # fall back to index.html and let the client-side router take over.
    # index.html itself is never cached, so a deploy is picked up on the
    # next page load instead of users running a stale build.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # script-src 'self' only: the pre-paint theme script is an external
        # file (public/theme-init.js) precisely so no 'unsafe-inline' is
        # needed for scripts. style-src needs 'unsafe-inline' because
        # Mermaid's sanitized SVG output and motion animations set inline
        # styles. img-src allows data:/blob: for PNG/SVG export.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # This container's OWN healthcheck — "is nginx serving," not "is the
    # backend up." Answering that here, without proxying to the backend,
    # keeps the two containers' health independent: a backend outage
    # shouldn't make Kubernetes report the frontend pod unhealthy too.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
}
