jenkins:
  systemMessage: "DiagramForge CI/CD - managed via Configuration as Code"
  numExecutors: 2
  mode: NORMAL
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:${JENKINS_ADMIN_ID}"

# Phase 3 removed this block: the plugin installed at the time
# (sonar-quality-gates) doesn't have a sonarGlobalConfiguration attribute,
# and it hard-crashed Jenkins on every boot. Phase 6 installs the classic
# "SonarQube Scanner" plugin (id: sonar) specifically for its pipeline
# steps (withSonarQubeEnv, waitForQualityGate) that the shared library
# depends on - that plugin does define this attribute, so this config is
# safe to restore.
unclassified:
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube-server"
        serverUrl: "http://localhost:9000"
        credentialsId: "sonarqube-token"

  globalLibraries:
    libraries:
      - name: "diagramforge-shared"
        defaultVersion: "main"
        implicit: false
        retriever:
          modernSCM:
            scm:
              git:
                # Jenkins can only load a shared library from the root of a
                # repo (neither SCM retriever has a subdirectory option), so
                # it lives in its own public repo. Public, so no credential
                # is needed - the fine-grained GitHub PAT is scoped to
                # Diagram-Ops only anyway.
                remote: "https://github.com/${GITHUB_USERNAME}/diagramforge-jenkins-shared-library.git"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_PAT}"
          - string:
              scope: GLOBAL
              id: "anthropic-api-key"
              secret: "${ANTHROPIC_API_KEY}"
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONARQUBE_TOKEN}"
          - string:
              scope: GLOBAL
              id: "nvd-api-key"
              secret: "${NVD_API_KEY}"
